  <div class="text-page">
<p>ミサキが乗り越えたのは、技術的な壁ではなく、この思い込みだった。</p>
<p>あなたの経験は、誰かの希望になる。</p>
<p>あなたの言葉は、誰かの背中を押せる。</p>
<p>あなたのキャリアは——あなたが決めていい。</p>
<p>この本を最後まで読んでくれたあなたへ。</p>
<p>今日が、あなたの「退職届を出した日」になりますように。</p>
<p>ミサキの物語は、あなたの物語のはじまりだ。</p>
<p>——（完）</p>
