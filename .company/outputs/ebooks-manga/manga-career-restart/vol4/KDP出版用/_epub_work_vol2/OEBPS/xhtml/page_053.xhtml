<h2>著者紹介　Yuichi</h2>
<p>キャリアコンサルタント／AI活用アドバイザー</p>
<p>企業人事として20年以上の経験を持ち、採用・育成・評価・労務管理に従事。</p>
<p>国家資格キャリアコンサルタントとして、これまでに100名以上のキャリア支援を行う。</p>
<p>現在は、転職・副業・AI活用をテーマに情報発信を行うほか、中小企業の経営者に対してAI導入・業務効率化の支援も行っている。</p>
<p>非エンジニア視点でのAI活用と、現場で使える形への落とし込みを強みとし、再現性の高い実践ノウハウを提供している。</p>
<p>※最新情報・無料相談はプロフィールよりご確認ください。</p>
