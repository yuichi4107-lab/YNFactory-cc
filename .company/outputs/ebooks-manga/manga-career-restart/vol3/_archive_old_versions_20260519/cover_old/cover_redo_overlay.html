<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1024px;
      height: 1536px;
      overflow: hidden;
      background: #111;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Hiragino Sans", serif;
    }
    .cover {
      position: relative;
      width: 1024px;
      height: 1536px;
      background-image: url("cover_base_redo.png");
      background-size: cover;
      background-position: center;
    }
    .title {
      position: absolute;
      left: 48px;
      top: 66px;
      height: 850px;
      display: flex;
      flex-direction: row-reverse;
      gap: 16px;
      align-items: flex-start;
      filter: drop-shadow(0 0 8px rgba(255, 244, 205, 1))
              drop-shadow(0 0 18px rgba(255, 207, 113, 0.55));
      font-weight: 900;
      line-height: 1;
    }
    .col {
      padding: 6px 2px;
      color: #2a150b;
      font-size: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .col.orange { color: #d9541f; }
    .col.blue { color: #145a9b; }
    .ai {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 86px;
      color: #e45b22;
      line-height: 0.85;
      letter-spacing: 0.02em;
    }
    .badge {
      position: absolute;
      top: 42px;
      right: 44px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #2a150b;
      background: rgba(255, 247, 220, 0.9);
      border: 4px dotted rgba(42, 21, 11, 0.76);
      box-shadow: 0 0 22px rgba(255, 238, 181, 0.96);
      font-weight: 900;
      text-align: center;
    }
    .badge .small {
      display: block;
      font-size: 40px;
      line-height: 1.05;
    }
    .badge .num {
      display: block;
      color: #df5a20;
      font-size: 112px;
      line-height: 0.88;
    }
    .subtitle {
      position: absolute;
      left: 66px;
      right: 66px;
      bottom: 184px;
      padding: 14px 22px 15px;
      color: #145a9b;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 37px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: 0.02em;
      text-align: center;
      background: rgba(255, 248, 226, 0.88);
      border-top: 4px solid rgba(224, 91, 31, 0.86);
      border-bottom: 4px solid rgba(224, 91, 31, 0.86);
      box-shadow: 0 0 16px rgba(255, 232, 170, 0.92);
      text-shadow: 0 1px 0 #fff;
    }
    .author {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 54px;
      text-align: center;
      color: #2b160c;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 44px;
      letter-spacing: 0.18em;
      text-shadow: 0 0 8px rgba(255, 244, 204, 1),
                   0 0 16px rgba(255, 206, 112, 0.72);
    }
  </style>
</head>
<body>
  <main class="cover">
    <section class="title" aria-label="title">
      <div class="col orange"><span>出</span><span>産</span><span>で</span></div>
      <div class="col"><span>キ</span><span>ャ</span><span>リ</span><span>ア</span><span>を</span><span>失</span><span>っ</span><span>た</span></div>
      <div class="col blue"><span>元</span><span>事</span><span>務</span><span>職</span><span>マ</span><span>マ</span><span>が</span><span>、</span></div>
      <div class="col ai"><span>A</span><span>I</span></div>
      <div class="col"><span>で</span><span>初</span><span>め</span><span>て</span><span>稼</span><span>ぐ</span><span>ま</span><span>で</span></div>
    </section>
    <section class="badge">
      <div>
        <span class="small">第</span>
        <span class="num">3</span>
        <span class="small">巻</span>
      </div>
    </section>
    <div class="subtitle">「AIって何？」から始まる<br>私の再出発</div>
    <div class="author">Yuichi</div>
  </main>
</body>
</html>
