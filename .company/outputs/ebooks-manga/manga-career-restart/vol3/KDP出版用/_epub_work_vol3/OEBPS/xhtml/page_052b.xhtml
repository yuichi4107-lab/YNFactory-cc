  <div class="text-page">
    <p>ミサキは、3日間の空白から戻ってきた。そして「子供が熱を出して3日間何もできなかった話」という、彼女にしか書けない投稿を書いた。完璧ではなかった。でも、戻ってきた。それが、AI時代のキャリアを積むすべての人に共通する、たったひとつの条件だ。</p>
    <p>止まってもいい。でも、やめない。AIは、あなたが戻ってくるのを待っている。</p>
