  <div class="text-page">
<p>ミサキが支払う9万円は、スキルに対する投資ではありません。</p>
<p>「自分は変われる」という仮説への投資です。</p>
<p>この仮説が正しいかどうかは、やってみないとわかりません。でも、仮説を立てること自体が、すでに前進です。</p>
<p>第4話のミサキは「このままじゃ無理だ」と思いました。第5話のミサキは「やってみよう」と決めました。</p>
<p>まだ何も成し遂げていません。でも、何かが確実に変わり始めています。</p>
<p>次の話から、ミサキは実際にAIに触れることになります。そこで彼女が見つけるのは、AIの便利さではなく——自分自身の可能性です。</p>
