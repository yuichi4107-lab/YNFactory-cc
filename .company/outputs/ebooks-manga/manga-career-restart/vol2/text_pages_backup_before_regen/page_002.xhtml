<h2>【前巻（第1巻）までのあらすじ】</h2>
<p>佐藤ミサキ（32歳）は、夫のケンタと幸せな妊娠生活を送っていた。しかし職場では「また産休か」という同僚の声、つわりとの闘い、そして給湯室で聞こえた本音——。</p>
<p>産休に入ったミサキは、復帰後の居場所がすでに失われていることを知る。在宅勤務の制度もなく、追い詰められた末に退職を決意。</p>
<p>退職届を出したその日、ミサキは「名刺のない世界」に放り出された。同期のグループを非表示にし、「何者でもない自分」に怯える日々。スマホの求人サイトを眺めても「事務しかやったことない私に、何ができるの」という問いが頭の中でループする。</p>
<p>ミサキの本当のキャリアは——ここから始まる。</p>
