<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <title>YNFactory Input Upload</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    body {
      margin: 0;
      background: Canvas;
      color: CanvasText;
    }
    main {
      width: min(720px, calc(100vw - 32px));
      margin: 24px auto;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }
    form {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
    }
    input, textarea, select, button {
      font: inherit;
      box-sizing: border-box;
      width: 100%;
      border: 1px solid color-mix(in srgb, CanvasText 24%, transparent);
      border-radius: 8px;
      padding: 10px 12px;
      background: Canvas;
      color: CanvasText;
    }
    textarea {
      min-height: 140px;
      resize: vertical;
    }
    button {
      cursor: pointer;
      font-weight: 700;
      background: #155eef;
      border-color: #155eef;
      color: white;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .status {
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      min-height: 24px;
    }
    .hint {
      font-size: 13px;
      opacity: .75;
      font-weight: 400;
    }
    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>インプット登録</h1>
    <div id="status" class="status">入力後、「登録する」を押してください。</div>
    <form id="form">
      <label>タイトル
        <input name="title" autocomplete="off" placeholder="未入力ならファイル名から自動設定">
      </label>
      <label>テキスト・メモ
        <textarea name="text" placeholder="保存したいメモ、URL、引用など"></textarea>
      </label>
      <label>URL
        <input name="url" inputmode="url" placeholder="https://example.com">
      </label>
      <label>ファイル
        <input name="files" type="file" multiple>
        <span class="hint">画像、PDF、Office、テキストなど。スマホでは写真/カメラ/Filesから選べます。</span>
      </label>
      <div class="row">
        <label>タグ
          <input name="tags" placeholder="client proposal idea">
        </label>
        <label>関連プロジェクト
          <input name="relatedProject" placeholder="project-name">
        </label>
      </div>
      <div class="row">
        <label>優先度
          <select name="priority">
            <option value="normal">normal</option>
            <option value="high">high</option>
            <option value="low">low</option>
          </select>
        </label>
        <label>TODO候補
          <select name="todoCandidate">
            <option value="false">しない</option>
            <option value="true">する</option>
          </select>
        </label>
      </div>
      <label>TODO候補メモ
        <textarea name="todoCandidates" placeholder="1行に1件ずつ"></textarea>
      </label>
      <button type="submit">登録する</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('form');
    const statusBox = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusBox.textContent = 'アップロード中...';
      const data = new FormData(form);
      const files = await Promise.all([...form.files.files].map(readFileAsPayload));
      const payload = {
        title: data.get('title') || '',
        text: data.get('text') || '',
        url: data.get('url') || '',
        tags: data.get('tags') || '',
        relatedProject: data.get('relatedProject') || '',
        priority: data.get('priority') || 'normal',
        todoCandidate: data.get('todoCandidate') === 'true',
        todoCandidates: data.get('todoCandidates') || '',
        files
      };
      google.script.run
        .withSuccessHandler((result) => {
          statusBox.textContent = `登録しました: ${result.inputId}`;
          form.reset();
        })
        .withFailureHandler((error) => {
          statusBox.textContent = `失敗しました: ${error.message || error}`;
        })
        .uploadInput(payload);
    });

    function readFileAsPayload(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result || '');
          const base64 = dataUrl.split(',')[1] || '';
          resolve({ name: file.name, mimeType: file.type, base64 });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
