<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}販売管理システム{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="app">
  <h1>販売管理システム</h1>
  <nav>
    <a href="{{ url_for('order_list') }}" class="{{ 'active' if nav == 'orders' }}">案件一覧</a>
    <a href="{{ url_for('closing') }}" class="{{ 'active' if nav == 'closing' }}">締め処理</a>
    <a href="{{ url_for('invoice_list') }}" class="{{ 'active' if nav == 'invoices' }}">請求一覧</a>
    <a href="{{ url_for('masters') }}" class="{{ 'active' if nav == 'masters' }}">マスタ</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ 'error' if category == 'error' else ('warn' if category == 'warn' else 'info') }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
